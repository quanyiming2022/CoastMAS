name: coastmas
services:
  database:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: coastmas
      POSTGRES_DB: coastmas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["coastmas_database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coastmas -d coastmas"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    ports: ["127.0.0.1:56379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["coastmas_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  object-storage:
    platform: linux/amd64
    image: quay.io/minio/minio@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set object storage user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set object storage password}
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["coastmas_objects:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  coastmas_database:
  coastmas_redis:
  coastmas_objects:
