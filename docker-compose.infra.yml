name: coastmas
services:
  database:
    image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    platform: linux/amd64
    environment:
      POSTGRES_USER: coastmas
      POSTGRES_DB: coastmas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["coastmas_database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coastmas -d coastmas"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    ports: ["127.0.0.1:56379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["coastmas_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  object-storage:
    platform: linux/arm64
    image: sha256:072e3ef119f19b6ebee3cb0129309f0ed50ff9988fae2b43ada4a68687334fb2
    pull_policy: never
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set object storage user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set object storage password}
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["coastmas_objects_native:/data"]
    healthcheck:
      test: ["CMD", "/usr/bin/health"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  coastmas_database:
  coastmas_redis:
  coastmas_objects_native:
    external: true
    name: coastmas_objects_native
