name: coastmas-test
services:
  database:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: coastmas
      POSTGRES_DB: coastmas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports: ["127.0.0.1:55433:5432"]
    tmpfs:
      - /var/lib/postgresql/data:size=536870912
      - /var/run/postgresql:size=16777216
    logging:
      driver: none
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coastmas -d coastmas"]
      interval: 2s
      timeout: 3s
      retries: 30
